services:
  - type: web
    name: llm-chatbot-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
